version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  versioning-strategy: increase
  commit-message:
    prefix: "fix(deps)"
    prefix-development: 'chore(deps):'
  groups:
    typescript:
      patterns:
        - "typescript"
        - "@typescript-*"
        - "@typescript/*"
        - "@types/node"
    biome:
      patterns:
        - "@biomejs/*"
    playwright:
      patterns:
        - "playwright"
        - "playwright-*"
        - "@playwright/*"

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  groups:
    github-actions:
      patterns:
        - "*"
