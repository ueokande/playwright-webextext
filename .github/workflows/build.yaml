name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Run lint and build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: 'package.json'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm run lint
    - run: pnpm run build

  test:
    name: Run test
    strategy:
      matrix:
        os: [ubuntu, macos, windows]
    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: 'package.json'
    - run: pnpm install --frozen-lockfile
    - name: Install Playwright browsers
      shell: bash
      run: |
        if pnpm exec playwright install --with-deps chromium firefox > playwright-install.log 2>&1; then
          cat playwright-install.log
        else
          cat playwright-install.log
          while IFS= read -r line; do
            line="${line//%/%25}"
            line="${line//$'\r'/%0D}"
            printf '::error::%s\n' "$line"
          done < <(tail -n 30 playwright-install.log)
          exit 1
        fi
      timeout-minutes: 10
    - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- pnpm run test
      if: runner.os == 'Linux'
    - run: pnpm run test
      if: runner.os != 'Linux'

  publish:
    name: Publish to NPM
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint, test]
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
    - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      id: release
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ steps.release.outputs.release_created }}
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      if: ${{ steps.release.outputs.release_created }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: 'package.json'
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'
      if: ${{ steps.release.outputs.release_created }}
    - run: pnpm install --frozen-lockfile
      if: ${{ steps.release.outputs.release_created }}
    - run: pnpm run build
      if: ${{ steps.release.outputs.release_created }}
    - run: pnpm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      if: ${{ steps.release.outputs.release_created }}
