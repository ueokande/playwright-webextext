name: Package E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.os }}, Playwright ${{ matrix.peer }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu
          peer: '1.12.0'
          container: mcr.microsoft.com/playwright:v1.12.0-focal
        - os: ubuntu
          peer: latest
          container: ''
        - os: macos
          peer: latest
          container: ''
        - os: windows
          peer: latest
          container: ''
    runs-on: ${{ matrix.os }}-latest
    container: ${{ matrix.container }}
    timeout-minutes: 20
    env:
      PEER_TARGET: ${{ matrix.peer }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: 'package.json'
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - run: pnpm install --frozen-lockfile
    - name: Pack and prepare the E2E consumer
      id: prepare
      run: pnpm run e2e:prepare
    - name: Install the packed library and peer target
      working-directory: ${{ steps.prepare.outputs.workspace }}
      shell: bash
      run: pnpm add --save-exact --ignore-scripts "playwright@$PEER_TARGET" "@playwright/test@$PEER_TARGET"
    - name: Install browser system dependencies
      if: runner.os == 'Linux' && matrix.peer == 'latest'
      working-directory: ${{ steps.prepare.outputs.workspace }}
      run: pnpm exec playwright install-deps chromium firefox
    - name: Install browsers for the peer target
      if: matrix.peer == 'latest'
      working-directory: ${{ steps.prepare.outputs.workspace }}
      run: pnpm exec playwright install chromium firefox
      timeout-minutes: 10
    - name: Prepare the historical Firefox display environment
      if: matrix.peer == '1.12.0'
      shell: bash
      run: |
        chown "$(id -u):$(id -g)" "$HOME"
        if ! command -v xauth >/dev/null; then
          apt-get update
          apt-get install -y --no-install-recommends xauth
        fi
    - name: Run package E2E (Linux)
      if: runner.os == 'Linux'
      working-directory: ${{ steps.prepare.outputs.workspace }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- pnpm run ${{ matrix.peer == '1.12.0' && 'test:legacy' || 'test' }}
    - name: Run package E2E (macOS and Windows)
      if: runner.os != 'Linux'
      working-directory: ${{ steps.prepare.outputs.workspace }}
      run: pnpm test
